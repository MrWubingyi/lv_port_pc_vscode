<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNG previews</title><style>
  :root{font-family:system-ui,sans-serif;color:#e9eef5;background:#151922}body{margin:0;padding:32px}h1{font-size:20px;margin:0 0 8px}.source{color:#9ba8ba;font-size:13px;margin-bottom:24px}.grid{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}figure{margin:0}.tile{width:128px;height:128px;display:grid;place-items:center;border:1px solid #394252;border-radius:12px;background-color:#202633;background-image:linear-gradient(45deg,#2c3443 25%,transparent 25%),linear-gradient(-45deg,#2c3443 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2c3443 75%),linear-gradient(-45deg,transparent 75%,#2c3443 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}img{image-rendering:auto}figcaption{text-align:center;color:#b9c4d3;font-size:13px;margin-top:8px}
  </style></head><body><h1>Transparent PNG previews</h1><div class="source">Source: source.html</div><main class="grid">
    <figure><div class="tile"><img src="16x16.png" width="16" height="16" alt="16 by 16 preview"></div><figcaption>16 x 16</figcaption></figure>
    <figure><div class="tile"><img src="24x24.png" width="24" height="24" alt="24 by 24 preview"></div><figcaption>24 x 24</figcaption></figure>
    <figure><div class="tile"><img src="32x32.png" width="32" height="32" alt="32 by 32 preview"></div><figcaption>32 x 32</figcaption></figure></main></body></html>
